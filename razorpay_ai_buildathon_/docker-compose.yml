services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      # POSTGRES_PASSWORD must be set in a root-level .env file.
      # Copy .env.example to .env and set a real value before running.
      # See README.md — "Database (Docker)" section.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Copy .env.example to .env and set a value.}
    ports:
      # Bound to localhost only — not exposed on the network interface.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
